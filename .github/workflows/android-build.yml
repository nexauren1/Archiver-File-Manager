name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Check APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Archiver-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub prerelease
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: preview-${{ github.run_number }}
          name: Archiver preview build ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            Automated preview build from the main branch.
            This is an early test build, not a stable production release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
