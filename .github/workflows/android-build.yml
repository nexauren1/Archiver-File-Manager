name: Android APK CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile and validate debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Validate Android version metadata
        shell: bash
        run: |
          set -euo pipefail
          VERSION_NAME="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\\([^']*\\)'.*/\\1/p" app/build.gradle | head -n 1)"
          VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\\([0-9][0-9]*\\).*/\\1/p' app/build.gradle | head -n 1)"
          test -n "$VERSION_NAME"
          [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]
          echo "Valid app version: $VERSION_NAME ($VERSION_CODE)"

      - name: Build debug APK
        run: gradle --no-daemon clean assembleDebug

      - name: Check APK exists and is not empty
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Generate SHA-256 checksum
        shell: bash
        run: |
          cd app/build/outputs/apk/debug
          sha256sum app-debug.apk > app-debug.apk.sha256
          cat app-debug.apk.sha256

      - name: Upload debug APK and checksum
        uses: actions/upload-artifact@v7
        with:
          name: Archiver-debug-APK
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 30
