name: Android APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Prepare Android release keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p app/build/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/build/keystore/release.jks
          test -s app/build/keystore/release.jks

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Build signed release APK when signing secrets are configured
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        run: gradle --no-daemon assembleRelease

      - name: Upload signed release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: Archiver-release-APK
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Check APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: Archiver-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable GitHub release
        if: github.event_name == 'push' && contains(github.event.head_commit.message, 'Release Archiver 0.8.0') && env.ANDROID_KEYSTORE_BASE64 != '' && env.ANDROID_KEYSTORE_PASSWORD != '' && env.ANDROID_KEY_ALIAS != '' && env.ANDROID_KEY_PASSWORD != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v0.8.0
          name: Archiver 0.8.0
          prerelease: false
          make_latest: true
          files: app/build/outputs/apk/release/app-release.apk
          body: |
            Archiver 0.8.0 — Android file manager.

            - Per-folder icon choices and folder background customization.
            - Storage usage summary and automatic current-folder refresh.
            - Updated bilingual website, privacy policy and terms of use.
            - Version code 10.

      - name: Publish GitHub prerelease
        if: (github.event_name == 'push' && (!contains(github.event.head_commit.message, 'Release Archiver 0.8.0') || env.ANDROID_KEYSTORE_BASE64 == '' || env.ANDROID_KEYSTORE_PASSWORD == '' || env.ANDROID_KEY_ALIAS == '' || env.ANDROID_KEY_PASSWORD == '')) || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: preview-${{ github.run_number }}
          name: Archiver preview build ${{ github.run_number }}
          prerelease: true
          make_latest: false
          files: app/build/outputs/apk/debug/app-debug.apk
          body: |
            Automated preview build from the main branch.
            This is an early test build, not a stable production release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
