name: Android Stable Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_version:
        description: "Version from app/build.gradle without the leading v (example: 0.8.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: android-stable-release
  cancel-in-progress: false

jobs:
  release:
    name: Build, verify and publish signed APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Validate release version
        id: version
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_VERSION_INPUT: ${{ inputs.release_version }}
        run: |
          set -euo pipefail
          APP_VERSION="$(sed -n "s/^[[:space:]]*versionName[[:space:]]*'\\([^']*\\)'.*/\\1/p" app/build.gradle | head -n 1)"
          APP_VERSION_CODE="$(sed -n 's/^[[:space:]]*versionCode[[:space:]]*\\([0-9][0-9]*\\).*/\\1/p' app/build.gradle | head -n 1)"
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG_VERSION="$RELEASE_VERSION_INPUT"
          else
            TAG_VERSION="${REF_NAME#v}"
          fi
          if [[ ! "$TAG_VERSION" =~ ^[0-9]+\\.[0-9]+\\.[0-9]+$ ]]; then
            echo "::error::Release version must look like 0.8.0."
            exit 1
          fi
          if [[ "$TAG_VERSION" != "$APP_VERSION" ]]; then
            echo "::error::Release tag/input v$TAG_VERSION does not match app/build.gradle versionName $APP_VERSION."
            exit 1
          fi
          if [[ ! "$APP_VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::app/build.gradle has an invalid versionCode."
            exit 1
          fi
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$APP_VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=$TAG_VERSION" >> "$GITHUB_ENV"
          echo "RELEASE_TAG=v$TAG_VERSION" >> "$GITHUB_ENV"
          echo "Validated Archiver v$TAG_VERSION (versionCode $APP_VERSION_CODE)."

      - name: Validate release signing secrets
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing required repository Actions secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Prepare signing keystore
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p app/build/keystore
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > app/build/keystore/release.jks
          test -s app/build/keystore/release.jks
          chmod 600 app/build/keystore/release.jks

      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon clean assembleRelease

      - name: Verify APK signature, alignment and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          BUILD_TOOLS_DIR="$(find "$SDK_ROOT/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          test -x "$BUILD_TOOLS_DIR/apksigner"
          test -x "$BUILD_TOOLS_DIR/zipalign"
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS_DIR/zipalign" -c -v 4 "$APK"
          mkdir -p release-dist
          cp "$APK" "release-dist/Archiver-${RELEASE_VERSION}.apk"
          (
            cd release-dist
            sha256sum "Archiver-${RELEASE_VERSION}.apk" > "Archiver-${RELEASE_VERSION}.apk.sha256"
            cat "Archiver-${RELEASE_VERSION}.apk.sha256"
          )

      - name: Upload verified release assets
        uses: actions/upload-artifact@v7
        with:
          name: Archiver-${{ steps.version.outputs.version }}-release-assets
          path: release-dist/*
          if-no-files-found: error
          retention-days: 90

      - name: Publish stable GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          name: Archiver ${{ env.RELEASE_TAG }}
          prerelease: false
          draft: false
          make_latest: true
          generate_release_notes: true
          files: release-dist/*
          body: |
            Archiver ${{ env.RELEASE_TAG }} — Android file manager.

            - Version code: ${{ steps.version.outputs.version_code }}
            - Signed release APK verified with apksigner.
            - APK ZIP alignment verified with zipalign.
            - SHA-256 checksum attached for integrity verification.

            Privacy policy: https://nexauren1.github.io/Archiver-File-Manager/privacy.html
            Website: https://nexauren1.github.io/Archiver-File-Manager/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
